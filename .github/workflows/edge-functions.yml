name: Validate Edge Functions

on:
  push:
    paths:
      - 'supabase/functions/**'
      - 'scripts/install-edge-functions-deps.sh'
      - '.github/workflows/edge-functions.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'

jobs:
  install-deps:
    name: Install & validate Deno deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install deps for all edge functions
        run: bash scripts/install-edge-functions-deps.sh

      - name: Lint edge functions (non-fatal)
        run: |
          for dir in supabase/functions/*/; do
            if [ -f "${dir}index.ts" ] && [ -f "${dir}deno.json" ]; then
              (cd "$dir" && deno lint index.ts 2>/dev/null) || true
            fi
          done
