name: Deploy Frontend → HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Create .htaccess
        run: |
          cat > dist/.htaccess << 'EOF'
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]

          <IfModule mod_headers.c>
            <FilesMatch "^(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$">
              Header set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
              Header set Pragma "no-cache"
              Header set Expires "0"
            </FilesMatch>
          </IfModule>

          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType image/jpg "access plus 1 year"
            ExpiresByType image/jpeg "access plus 1 year"
            ExpiresByType image/gif "access plus 1 year"
            ExpiresByType image/png "access plus 1 year"
            ExpiresByType image/webp "access plus 1 year"
            ExpiresByType text/css "access plus 1 month"
            ExpiresByType application/javascript "access plus 1 month"
            ExpiresByType image/svg+xml "access plus 1 month"
            ExpiresByType font/woff2 "access plus 1 year"
          </IfModule>

          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
          </IfModule>
          EOF

      - name: Deploy via FTP (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp dnsutils

          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Secrets FTP_SERVER, FTP_USERNAME e FTP_PASSWORD são obrigatórios."
            exit 1
          fi

          TARGET_DIR="${FTP_SERVER_DIR:-/public_html/}"

          echo "Validando DNS de $FTP_SERVER..."
          nslookup "$FTP_SERVER" || true

          echo "Testando conectividade na porta 21..."
          if ! timeout 10 bash -c "</dev/tcp/$FTP_SERVER/21"; then
            echo "::error::Runner do GitHub não conseguiu alcançar $FTP_SERVER:21 (bloqueio de rede/firewall)."
            exit 1
          fi

          cat > /tmp/deploy-ftp.lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 30
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set dns:order inet
          set ftp:passive-mode true
          set ftp:ssl-allow true
          set ssl:verify-certificate false
          open -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "ftp://$FTP_SERVER"
          cls
          mirror --reverse --delete --verbose ./dist/ "$TARGET_DIR"
          bye
          EOF

          if ! lftp -f /tmp/deploy-ftp.lftp; then
            echo "::warning::FTP padrão falhou, tentando FTPS explícito..."

            cat > /tmp/deploy-ftps.lftp <<EOF
            set cmd:fail-exit yes
            set net:timeout 30
            set net:max-retries 2
            set net:reconnect-interval-base 5
            set dns:order inet
            set ftp:passive-mode true
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate false
            open -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "ftp://$FTP_SERVER"
            cls
            mirror --reverse --delete --verbose ./dist/ "$TARGET_DIR"
            bye
            EOF

            lftp -f /tmp/deploy-ftps.lftp
          fi
