name: Deploy Frontend via SFTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Create .htaccess
        run: |
          printf '%s\n' \
            'RewriteEngine On' \
            'RewriteBase /' \
            'RewriteRule ^index\.html$ - [L]' \
            'RewriteCond %{REQUEST_FILENAME} !-f' \
            'RewriteCond %{REQUEST_FILENAME} !-d' \
            'RewriteRule . /index.html [L]' \
            '' \
            '<IfModule mod_headers.c>' \
            '  <FilesMatch "^(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$">' \
            '    Header set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"' \
            '    Header set Pragma "no-cache"' \
            '    Header set Expires "0"' \
            '  </FilesMatch>' \
            '</IfModule>' \
            '' \
            '<IfModule mod_deflate.c>' \
            '  AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml' \
            '</IfModule>' \
            > dist/.htaccess

      - name: Deploy via SFTP
        uses: appleboy/scp-action@v0.2.0
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          source: "dist/*"
          target: ${{ secrets.FTP_SERVER_DIR || '/home/praefe10/public_html' }}
          strip_components: 1

      - name: Success summary
        run: echo "Deploy SFTP concluído com sucesso."
