# Exemplo para o Fly.io (fly launch --no-deploy; depois fly secrets set PROXY_TOKEN=...)
app = "praefectus-sefaz-proxy"
primary_region = "gru"

[build]

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
