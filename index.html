    <script>
      // Auto-reload on stale chunk errors after deploy
      window.addEventListener('error', function(e) {
        if (e.message && (
          e.message.indexOf('Failed to fetch dynamically imported module') !== -1 ||
          e.message.indexOf('Importing a module script failed') !== -1 ||
          e.message.indexOf('error loading dynamically imported module') !== -1
        )) {
          var reloaded = sessionStorage.getItem('chunk-reload');
          if (!reloaded) {
            sessionStorage.setItem('chunk-reload', '1');
            window.location.reload();
          } else {
            sessionStorage.removeItem('chunk-reload');
          }
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var msg = e.reason && (e.reason.message || String(e.reason));
        if (msg && (
          msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
          msg.indexOf('Importing a module script failed') !== -1
        )) {
          var reloaded = sessionStorage.getItem('chunk-reload');
          if (!reloaded) {
            sessionStorage.setItem('chunk-reload', '1');
            window.location.reload();
          } else {
            sessionStorage.removeItem('chunk-reload');
          }
        }
      });
    </script>
